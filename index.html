<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IPAK Gateway</title>
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ecf7ef; --bg2:#d6eddd; --surface:rgba(255,255,255,.7); --solid:#fff;
  --border:rgba(22,101,52,.15); --text:#0d2817; --muted:#4b6a57;
  --g1:#14532d; --g2:#16a34a; --g3:#4ade80; --accent:#15803d;
  --shadow:0 12px 32px -14px rgba(20,83,45,.35);
  --font:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
:root[data-theme="dark"]{
  --bg:#06120a; --bg2:#0b2113; --surface:rgba(17,42,28,.62); --solid:#10281a;
  --border:rgba(74,222,128,.17); --text:#e8f5ec; --muted:#8db09a;
  --g1:#052e16; --g2:#22c55e; --g3:#4ade80; --accent:#4ade80;
  --shadow:0 14px 36px -16px rgba(0,0,0,.8);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:var(--font);color:var(--text);min-height:100vh;
  background:linear-gradient(180deg,var(--bg),var(--bg2));background-attachment:fixed;
  overflow-x:hidden;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);
}
/* floating blobs */
.blob{position:fixed;border-radius:50%;filter:blur(70px);opacity:.5;z-index:0;pointer-events:none;animation:float 16s ease-in-out infinite}
.b1{width:420px;height:420px;background:#4ade80;top:-120px;right:-80px}
.b2{width:360px;height:360px;background:#16a34a;bottom:-100px;left:-100px;animation-delay:-6s;opacity:.35}
.b3{width:240px;height:240px;background:#bef264;top:45%;left:55%;animation-delay:-11s;opacity:.25}
:root[data-theme="dark"] .blob{opacity:.22}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(40px,-30px) scale(1.12)}}

.wrap{position:relative;z-index:1;max-width:1120px;margin:0 auto;padding:22px 20px 56px}
.glass{background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:34px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand img{width:48px;height:48px;object-fit:contain;border-radius:13px;background:var(--solid);padding:5px;border:1px solid var(--border);box-shadow:var(--shadow)}
.brand b{display:block;font-size:17px;font-weight:800;letter-spacing:-.01em}
.brand span{font-size:12.5px;color:var(--muted)}
.tools{display:flex;gap:10px}
.icon-btn{width:42px;height:42px;border-radius:13px;color:var(--text);cursor:pointer;display:grid;place-items:center;transition:transform .15s,border-color .15s}
.icon-btn:hover{border-color:var(--g2);transform:translateY(-2px) rotate(-6deg)}
.icon-btn svg{width:20px;height:20px}
.sun{display:none}
:root[data-theme="dark"] .sun{display:block}
:root[data-theme="dark"] .moon{display:none}

/* hero (compact) */
.hero{position:relative;overflow:hidden;border-radius:22px;margin-bottom:22px;padding:18px 22px 22px;color:#fff;
  background:linear-gradient(135deg,#14532d,#16a34a 60%,#4ade80);box-shadow:0 18px 38px -18px rgba(22,163,74,.7);
  display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.hero::after{content:"";position:absolute;right:-40px;top:-70px;width:170px;height:170px;border-radius:50%;border:26px solid rgba(255,255,255,.12);pointer-events:none}
.greet{position:relative;z-index:1;min-width:0}
.wave{font-size:13px;font-weight:600;opacity:.9}
.greet h1{font-size:clamp(22px,3.6vw,30px);font-weight:800;letter-spacing:-.02em;line-height:1.1;margin-top:3px}
.greet h1 .emo{display:inline-block;animation:bob 3s ease-in-out infinite;transform-origin:70% 70%}
@keyframes bob{0%,100%{transform:rotate(0)}50%{transform:rotate(14deg)}}
.pills{position:relative;z-index:1;display:flex;gap:10px;flex-wrap:wrap}
.pill{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.28);border-radius:14px;padding:8px 14px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.digital{font-size:20px;font-weight:800;letter-spacing:-.01em;font-variant-numeric:tabular-nums;line-height:1.1}
.digital i{font-style:normal;font-size:.6em;font-weight:700;margin-left:4px;opacity:.9}
.date-big{font-size:14px;font-weight:700;line-height:1.2}
.date-sub{font-size:11.5px;opacity:.88;margin-top:2px}
.dayline{position:absolute;left:0;right:0;bottom:0;height:5px;background:rgba(255,255,255,.2)}
.fill{height:100%;width:0;background:#fff;opacity:.85;transition:width 1s linear}

/* controls */
.controls{display:flex;flex-wrap:wrap;align-items:center;gap:14px;margin-bottom:24px}
.search{position:relative;flex:1 1 280px;max-width:420px}
.search svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:19px;height:19px;color:var(--muted)}
.search input{width:100%;height:50px;border-radius:16px;padding:0 54px 0 46px;font:500 15px var(--font);color:var(--text);outline:none;transition:border-color .15s,box-shadow .15s}
.search input::placeholder{color:var(--muted)}
.search input:focus{border-color:var(--g2);box-shadow:0 0 0 4px rgba(34,197,94,.2)}
.search kbd{position:absolute;right:14px;top:50%;transform:translateY(-50%);font:600 12px var(--font);color:var(--muted);border:1px solid var(--border);border-radius:7px;padding:3px 8px;background:var(--solid)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--border);background:var(--surface);color:var(--text);font:600 13.5px var(--font);padding:10px 16px;border-radius:999px;cursor:pointer;transition:all .15s}
.chip:hover{border-color:var(--g2)}
.chip.on{background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;border-color:transparent;box-shadow:0 8px 18px -8px var(--g2)}
.count{margin-left:auto;font-size:13px;color:var(--muted);font-weight:600}

/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px;perspective:900px}
.card{position:relative;display:flex;flex-direction:column;gap:12px;padding:22px;border-radius:24px;text-decoration:none;color:inherit;overflow:hidden;
  transition:transform .18s ease-out,border-color .2s;transform-style:preserve-3d;animation:rise .5s both}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.card::before{content:"";position:absolute;inset:0;background:radial-gradient(240px 170px at var(--mx,80%) var(--my,0%),rgba(74,222,128,.32),transparent 70%);opacity:0;transition:opacity .25s;pointer-events:none}
.card:hover,.card:focus-visible{border-color:var(--g2)}
.card:hover::before,.card:focus-visible::before{opacity:1}
.card:focus-visible{outline:3px solid var(--g3);outline-offset:3px}
.ico{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--g1),var(--g2));box-shadow:0 10px 20px -8px var(--g2);transition:transform .25s}
.card:hover .ico{transform:scale(1.08) rotate(-5deg)}
.ico svg{width:27px;height:27px}
.card h2{font-size:18px;font-weight:700;letter-spacing:-.01em}
.card p{font-size:13.5px;line-height:1.5;color:var(--muted);flex:1}
.meta{display:flex;align-items:center;justify-content:space-between;font-size:13.5px;font-weight:700;color:var(--accent)}
.meta svg{width:18px;height:18px;transition:transform .2s}
.card:hover .meta svg{transform:translate(3px,-3px)}
.cat{font-size:11.5px;font-weight:700;color:var(--accent);background:rgba(34,197,94,.14);border-radius:999px;padding:4px 10px;align-self:flex-start}
.pin{position:absolute;top:16px;right:16px;width:34px;height:34px;border-radius:11px;border:1px solid var(--border);background:var(--solid);color:var(--muted);cursor:pointer;display:grid;place-items:center;z-index:2;transition:all .15s}
.pin svg{width:17px;height:17px}
.pin:hover{color:#eab308;transform:scale(1.1)}
.pin.on{color:#eab308;border-color:#eab308}
.pin.on svg{fill:#eab308}
.empty{display:none;text-align:center;color:var(--muted);padding:44px 0}
footer{margin-top:50px;text-align:center;color:var(--muted);font-size:12.5px}

@media (max-width:820px){.count{display:none}}
@media (max-width:520px){.search kbd{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <img id="logo" src="logo.png" alt="IPAK logo">
      <div><b>IPAK Gateway</b><span>All programs in one place</span></div>
    </div>
    <div class="tools">
      <button class="icon-btn glass" id="fs" aria-label="Full screen">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
      </button>
      <button class="icon-btn glass" id="theme" aria-label="Switch light or dark theme">
        <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </header>

  <section class="hero">
    <div class="greet">
      <div class="wave" id="urdu">Assalam o Alaikum</div>
      <h1><span id="greet">Welcome</span> <span class="emo" id="emo">👋</span></h1>
    </div>
    <div class="pills">
      <div class="pill"><div class="digital"><span id="time">--:--:--</span><i id="ampm"></i></div></div>
      <div class="pill"><div class="date-big" id="dateBig">--</div><div class="date-sub" id="dateSub">--</div></div>
    </div>
    <div class="dayline" title="Day progress"><div class="fill" id="fd"></div></div>
  </section>

  <div class="controls">
    <label class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" class="glass" type="search" placeholder="Search programs" autocomplete="off" aria-label="Search programs">
      <kbd>/</kbd>
    </label>
    <div class="chips" id="chips"></div>
    <div class="count" id="count"></div>
  </div>

  <main class="grid" id="grid"></main>
  <div class="empty" id="empty">No program matches your search.</div>

  <footer>&copy; <span id="yr">2026</span> All rights reserved by HR Design Innovation &amp; Systems Department</footer>
</div>

<script>
/* Naya link add karne ke liye bas yahan ek line add kar dein */
const APPS = [
  { id:"hr",      name:"HR Analytics Dashboard",  cat:"HR",    desc:"HR data, charts and insights in one dashboard.", url:"https://ipakesp.github.io/hranalytics/index.html", icon:"chart" },
  { id:"portal",  name:"iPortal",                 cat:"HR",    desc:"IPAK portal for daily work and updates.", url:"https://ipakesp.github.io/IPAKportal/", icon:"portal" },
  { id:"survey",  name:"Employee Services Survey",cat:"Forms", desc:"Share your feedback on employee services.", url:"https://script.google.com/macros/s/AKfycbwmOerIrufHy9Gt1z2iUTLOKM8eEqgsnM7QdosplqxG6CWM8xdTgxKvq-RnJBAgajkgng/exec", icon:"survey" },
  { id:"mess",    name:"Mess Cost Data Uploader", cat:"Tools", desc:"Upload and manage mess cost data.", url:"https://script.google.com/macros/s/AKfycbwtra9tRClfN9-S497XGVzjB-_vyr6pzNj0cr71JXMzPItI9jGTWMuqBGxMdwSCcn69tg/exec", icon:"upload" },
  { id:"pms",     name:"IPAK PMS",                cat:"HR",    desc:"Performance management system.", url:"https://script.google.com/macros/s/AKfycbw3FigID5B_yqKXuSL4bQd77gpi8b9qFw3uVaEmP6wifmpb4zZKAQipCuE8c5CzlsUegA/exec", icon:"target" },
  { id:"card",    name:"Employee Card Generator", cat:"Tools", desc:"Create employee ID cards in a few clicks.", url:"https://ipakesp.github.io/employeeid/", icon:"card" }
];
const ICONS = {
  chart:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
  portal:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.2 3 14.8 0 18M12 3c-3 3.2-3 14.8 0 18"/>',
  survey:'<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h3"/>',
  upload:'<path d="M12 16V4M7 9l5-5 5 5M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/>',
  target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5"/>',
  card:'<rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="11" r="2"/><path d="M6.5 16c.5-1.6 4.5-1.6 5 0M14 10h4M14 14h3"/>'
};
const svg = (p,x="") => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ${x}>${p}</svg>`;
const $ = id => document.getElementById(id);

/* ---------- logo: try common names, then show text badge ---------- */
(function(){
  const img=$("logo"), tries=["Logo.png","logo.PNG","LOGO.png","logo.jpg","logo.jpeg","logo.webp","logo.svg","assets/logo.png","images/logo.png"];
  img.addEventListener("error",function next(){
    const t=tries.shift();
    if(t){ img.src=t; return; }
    img.removeEventListener("error",next);
    const b=document.createElement("div");
    b.textContent="IPAK";
    b.style.cssText="width:48px;height:48px;border-radius:13px;display:grid;place-items:center;font-weight:800;font-size:14px;color:#fff;background:linear-gradient(135deg,#14532d,#16a34a);box-shadow:var(--shadow)";
    img.replaceWith(b);
  });
})();

$("yr").textContent=new Date().getFullYear();

/* ---------- storage helpers ---------- */
const store = {
  get(k,d){ try{ const v=localStorage.getItem(k); return v===null?d:JSON.parse(v);}catch(e){return d;} },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
};
let pins = store.get("ipak-pins", []);
let cat = "All", term = "";

/* ---------- cards ---------- */
const cats = ["All","Pinned",...new Set(APPS.map(a=>a.cat))];
$("chips").innerHTML = cats.map(c=>`<button class="chip${c==="All"?" on":""}" data-c="${c}">${c}</button>`).join("");

function render(){
  let list = APPS.filter(a =>
    (cat==="All" || (cat==="Pinned" ? pins.includes(a.id) : a.cat===cat)) &&
    (a.name+" "+a.desc+" "+a.cat).toLowerCase().includes(term));
  list.sort((a,b)=> (pins.includes(b.id)) - (pins.includes(a.id)));
  $("grid").innerHTML = list.map((a,i)=>`
    <a class="card glass" href="${a.url}" target="_blank" rel="noopener noreferrer" style="animation-delay:${i*60}ms">
      <button class="pin${pins.includes(a.id)?" on":""}" data-id="${a.id}" aria-label="Pin ${a.name}" title="Pin to top">${svg('<path d="m12 2.5 2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4 6.1 20.5l1.2-6.5L2.5 9.4l6.6-.9z"/>')}</button>
      <div class="ico">${svg(ICONS[a.icon])}</div>
      <span class="cat">${a.cat}</span>
      <h2>${a.name}</h2>
      <p>${a.desc}</p>
      <div class="meta"><span>Open</span>${svg('<path d="M7 17 17 7M8 7h9v9"/>')}</div>
    </a>`).join("");
  $("empty").style.display = list.length ? "none" : "block";
  $("count").textContent = list.length + (list.length===1?" program":" programs");
}
render();

$("q").addEventListener("input", e=>{ term=e.target.value.trim().toLowerCase(); render(); });
$("chips").addEventListener("click", e=>{
  const b=e.target.closest(".chip"); if(!b) return;
  cat=b.dataset.c;
  document.querySelectorAll(".chip").forEach(c=>c.classList.toggle("on",c===b));
  render();
});
$("grid").addEventListener("click", e=>{
  const p=e.target.closest(".pin"); if(!p) return;
  e.preventDefault(); e.stopPropagation();
  const id=p.dataset.id;
  pins = pins.includes(id) ? pins.filter(x=>x!==id) : [...pins,id];
  store.set("ipak-pins",pins); render();
});
$("grid").addEventListener("pointermove", e=>{
  const c=e.target.closest(".card"); if(!c) return;
  const r=c.getBoundingClientRect(), x=e.clientX-r.left, y=e.clientY-r.top;
  c.style.setProperty("--mx",x+"px"); c.style.setProperty("--my",y+"px");
  const rx=((y/r.height)-.5)*-6, ry=((x/r.width)-.5)*6;
  c.style.transform=`rotateX(${rx}deg) rotateY(${ry}deg) translateY(-4px)`;
});
$("grid").addEventListener("pointerout", e=>{
  const c=e.target.closest(".card"); if(c) c.style.transform="";
});
document.addEventListener("keydown", e=>{
  if(e.key==="/" && document.activeElement!==$("q")){ e.preventDefault(); $("q").focus(); }
  if(e.key==="Enter" && document.activeElement===$("q")){ const f=$("grid").querySelector(".card"); if(f) f.click(); }
});

/* ---------- clock, greeting, date, progress ---------- */
const TZ="Asia/Karachi";
const pk = () => new Date(new Date().toLocaleString("en-US",{timeZone:TZ}));
const GREETS = [
  {from:5,  to:12, t:"Good Morning",   u:"Subah Bakhair",    e:"☀️", l:"A fresh start. Pick a program and get going."},
  {from:12, to:17, t:"Good Afternoon", u:"Assalam o Alaikum",e:"🌤️", l:"Hope your day is going well. Everything is one tap away."},
  {from:17, to:21, t:"Good Evening",   u:"Shaam Bakhair",    e:"🌇", l:"Wrapping up? Quickly open what you need."},
  {from:21, to:29, t:"Good Night",     u:"Shab Bakhair",     e:"🌙", l:"Working late? Take a break when you can."}
];
const MON=["January","February","March","April","May","June","July","August","September","October","November","December"];
const DAY=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
let lastGreet="";
function tick(){
  const d=pk(), h=d.getHours(), m=d.getMinutes(), s=d.getSeconds();
  /* greeting */
  const hh=h<5?h+24:h;
  const g=GREETS.find(x=>hh>=x.from&&hh<x.to)||GREETS[3];
  if(g.t!==lastGreet){
    lastGreet=g.t; $("greet").textContent=g.t; $("urdu").textContent=g.u; $("emo").textContent=g.e; 
  }
  /* clock */
  const h12=h%12||12, p=n=>String(n).padStart(2,"0");
  $("time").textContent=`${p(h12)}:${p(m)}:${p(s)}`;
  $("ampm").textContent=h<12?"AM":"PM";
  /* date */
  $("dateBig").textContent=`${DAY[d.getDay()]}, ${d.getDate()} ${MON[d.getMonth()].slice(0,3)}`;
  let hijri="";
  try{ hijri=new Intl.DateTimeFormat("en-u-ca-islamic-umalqura",{day:"numeric",month:"long",year:"numeric",timeZone:TZ}).format(new Date()).replace(/ AH$/," AH"); }catch(e){}
  $("dateSub").textContent=`${d.getFullYear()}${hijri?" · "+hijri:""}`;
  /* day progress */
  $("fd").style.width=((h*3600+m*60+s)/86400*100).toFixed(2)+"%";
}
tick(); setInterval(tick,1000);

/* ---------- theme & fullscreen ---------- */
const root=document.documentElement;
const savedTheme=store.get("ipak-theme",null);
if(savedTheme) root.dataset.theme=savedTheme;
else if(window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches) root.dataset.theme="dark";
$("theme").addEventListener("click",()=>{
  const n=root.dataset.theme==="dark"?"light":"dark";
  root.dataset.theme=n; store.set("ipak-theme",n);
});
$("fs").addEventListener("click",()=>{
  if(!document.fullscreenElement) document.documentElement.requestFullscreen?.();
  else document.exitFullscreen?.();
});
</script>
</body>
</html>
